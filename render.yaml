# Render Blueprint (ADR-0035). Render reads this when you create a Blueprint
# from the repo; setup steps are in docs/infrastructure/deploy.md.
#
# One web service serves the API, the websockets AND the built SPA on one
# origin (the refresh cookie depends on that). Postgres is NOT here: Render's
# free Postgres is deleted after 30 days, so it lives on Neon and DATABASE_URL
# is pasted in by hand.
services:
  - type: web
    name: wchess
    runtime: node
    plan: free
    region: singapore
    branch: main # production = main (dev -> staging -> main)
    # --include=dev: NODE_ENV=production below makes npm skip devDependencies,
    # which hold the Nest CLI, TypeScript, Vite and the Prisma CLI.
    buildCommand: >-
      cd frontend && npm ci --include=dev && npm run build &&
      cd ../backend && npm ci --include=dev && npx prisma generate && npm run build
    # Migrations run on every boot; a failing DB connection fails the deploy here.
    startCommand: cd backend && npx prisma migrate deploy && node dist/main
    # Liveness only: Render polls this often, and the DB-backed /health would keep Neon awake.
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production # Secure cookie, JSON logs, no Swagger
      - key: TRUST_PROXY
        value: "1" # makes req.ip/req.secure proxy-aware; NOT enough for throttling here, see below
      - key: CLIENT_IP_HEADER
        # Render sits behind Cloudflare, which sets this itself. With TRUST_PROXY alone,
        # req.ip was Render's rotating proxy IPs and login throttling never fired.
        value: cf-connecting-ip
      - key: JWT_SECRET
        generateValue: true # 256 random bits, generated by Render, never in git
      - key: DATABASE_URL
        sync: false # Neon connection string, pasted in the dashboard
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wchess-redis
          property: connectionString

  - type: keyvalue
    name: wchess-redis
    plan: free
    region: singapore
    # Redis holds live game state, not a cache: refuse writes when full
    # rather than silently evict a running game.
    maxmemoryPolicy: noeviction
    ipAllowList: [] # private network only, nothing reachable from the internet
